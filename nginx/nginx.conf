server {
    listen 80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Django admin / DRF / Swagger static
    location /static/admin/ {
        alias /static/admin/;
    }

    location /static/rest_framework/ {
        alias /static/rest_framework/;
    }

    location /static/drf-yasg/ {
        alias /static/drf-yasg/;
    }

    # React frontend static
    location /static/js/ {
        proxy_pass http://frontend:80/static/js/;
    }

    location /static/css/ {
        proxy_pass http://frontend:80/static/css/;
    }

    location /static/media/ {
        proxy_pass http://frontend:80/static/media/;
    }

    # Uploaded media from Django
    location /media/ {
        alias /media/;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
    }

    location /swagger/ {
        proxy_pass http://backend:8000/swagger/;
    }

    location /redoc/ {
        proxy_pass http://backend:8000/redoc/;
    }

    location /manifest.json {
        proxy_pass http://frontend:80/manifest.json;
    }

    location /favicon.ico {
        proxy_pass http://frontend:80/favicon.ico;
    }

    location /asset-manifest.json {
        proxy_pass http://frontend:80/asset-manifest.json;
    }

    location /robots.txt {
        proxy_pass http://frontend:80/robots.txt;
    }

    location = /index.html {
        proxy_pass http://frontend:80/index.html;
    }

    location / {
        proxy_pass http://frontend:80/;
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }
}